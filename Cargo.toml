[workspace]
resolver = "3"
members = ["crates/hone-core", "crates/hone-cli", "crates/hone-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NavilaLabs/hone"
publish = false

[workspace.dependencies]
hone-core = { path = "crates/hone-core" }
hone-mcp = { path = "crates/hone-mcp" }
clap = { version = "4.6.8", features = ["derive", "env"] }
getrandom = "0.4.3"
jsonschema = { version = "0.61.2", default-features = false }
regex = "1.13.1"
rmcp = { version = "3.11.0", default-features = false }
ryu-js = "1.0.3"
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = "1.54.1"
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_code = "forbid"
