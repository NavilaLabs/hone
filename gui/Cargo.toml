# The desktop GUI (concept Section 12, "Desktop GUI"): a workspace of its own, because a web view
# needs system libraries that the protocol crates do not. See README.md.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "hone-gui"
description = "Desktop GUI of the hone reference implementation, over the command line."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NavilaLabs/hone"
publish = false

[[bin]]
name = "hone-gui"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "macro", "html", "signals", "hooks", "document"] }
keyring = "4.2.0"
png = "0.18.1"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "macros", "sync"] }
tw_merge = "0.1.22"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
